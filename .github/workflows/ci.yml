name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  unitarias:
    name: Unitarias (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -warnaserror
      - name: Pruebas sin base de datos
        run: dotnet test --no-build --filter "Categoria!=Integracion"
      - name: Cobertura del dominio (umbral bloqueante)
        run: >
          dotnet test tests/GestorInve.Core.Tests --no-build
          /p:CollectCoverage=true /p:ThresholdType=line /p:Threshold=90
      - name: Paquetes vulnerables
        shell: bash
        run: |
          # pipefail + comprobación explícita: si el propio comando falla (restore roto,
          # feed caído, .slnx no soportado) el paso debe fallar, no reportar "sin vulnerabilidades".
          set -euo pipefail
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if ! grep -q "The following sources were used:" vuln.txt; then
            echo "::error::La auditoría de paquetes no produjo un informe válido."
            exit 1
          fi
          if grep -q "has the following vulnerable packages" vuln.txt; then
            echo "::error::Hay paquetes con vulnerabilidades conocidas."
            exit 1
          fi

  integracion:
    name: Integración (PostgreSQL)
    # Solo Linux: los contenedores de servicio de Actions no existen en los runners de Windows.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Rol sin privilegios para la aplicación
        # Imprescindible: un superusuario (o cualquier rol con BYPASSRLS) ignora las políticas
        # RLS, así que probar con el usuario por defecto de la imagen daría una garantía falsa.
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "create role gestorinve login password 'gestorinve';" \
            -c "create database gestorinve owner gestorinve;"
          test "$(psql -h 127.0.0.1 -U postgres -tAc \
            "select rolsuper or rolbypassrls from pg_roles where rolname = 'gestorinve'")" = "f"
      - run: dotnet restore
      - run: dotnet build --no-restore -warnaserror
      - name: Pruebas de integración
        env:
          GESTORINVE_CONEXION_TEST: Host=127.0.0.1;Port=5432;Database=gestorinve;Username=gestorinve;Password=gestorinve
        run: |
          # `dotnet test` sale en 0 cuando el filtro no encuentra nada: sin este guardia, renombrar
          # la etiqueta dejaría las pruebas de aislamiento sin ejecutar y el CI seguiría verde.
          set -euo pipefail
          dotnet test --no-build --filter "Categoria=Integracion" | tee integracion.log
          ejecutadas=$(grep -oE 'Passed:[[:space:]]+[0-9]+' integracion.log \
            | grep -oE '[0-9]+' | awk '{s += $1} END {print s + 0}')
          echo "Pruebas de integración ejecutadas: ${ejecutadas:-0}"
          if [ "${ejecutadas:-0}" -lt 1 ]; then
            echo "::error::El filtro no ejecutó ninguna prueba de integración."
            exit 1
          fi

  web:
    name: Web (compilación y unitarias)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # `tsc --noEmit` antes del build: el cliente está tipado desde el OpenAPI, así que un
      # cambio de contrato en la Api tiene que romper aquí y no en una pantalla del usuario.
      - run: npm run build
      - run: npm test

  e2e:
    name: Web de punta a punta (navegador real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 10
    env:
      CADENA: Host=127.0.0.1;Port=5432;Database=gestorinve;Username=gestorinve;Password=gestorinve
      CLAVE_JWT: clave-de-ci-con-mas-de-32-bytes-para-hmac-sha256
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Rol sin privilegios para la aplicación
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "create role gestorinve login password 'gestorinve';" \
            -c "create database gestorinve owner gestorinve;"
          test "$(psql -h 127.0.0.1 -U postgres -tAc \
            "select rolsuper or rolbypassrls from pg_roles where rolname = 'gestorinve'")" = "f"
      - name: Compilar
        run: |
          set -euo pipefail
          dotnet build src/GestorInve.Api --configuration Release
          cd web && npm ci && npm run build
          npx playwright install --with-deps chromium
      - name: Arrancar y probar de punta a punta
        run: |
          set -euo pipefail
          # Api y web se arrancan **en este mismo paso**: un proceso en segundo plano no
          # sobrevive al final del paso que lo lanzó.
          # `GESTORINVE_MIGRAR=true` es el mismo camino de actualización que usan el
          # contenedor y el instalador; sin esquema la Api arrancaría «sana» contra una base
          # vacía y el e2e fallaría al primer alta. `/ready` solo responde tras migrar.
          ASPNETCORE_URLS=http://127.0.0.1:5080 \
          GESTORINVE_MIGRAR=true \
          ConnectionStrings__GestorInve="$CADENA" \
          Jwt__Clave="$CLAVE_JWT" \
            dotnet src/GestorInve.Api/bin/Release/net10.0/GestorInve.Api.dll > api.log 2>&1 &
          api=$!

          node web/e2e/servidor.mjs > web.log 2>&1 &
          web=$!

          esperar() {
            for intento in $(seq 1 30); do
              curl -fsS "$1" > /dev/null && return 0
              sleep 2
            done
            return 1
          }

          # El diagnóstico se emite como **anotaciones** y no solo por stdout: el registro
          # completo del job y los artefactos viven en hosts que no siempre son alcanzables,
          # mientras que las anotaciones se leen por la API de GitHub. Sin esto, un fallo del
          # e2e se queda en «exit code 1» y hay que adivinar la causa.
          anotar() {
            [ -s "$2" ] || return 0
            echo "::error title=$1::$(tail -c 1800 "$2" | tr '\n%\r' '  ')"
          }

          if ! esperar http://127.0.0.1:5080/ready; then
            anotar "La Api no respondió en /ready" api.log; cat api.log; exit 1
          fi

          if ! esperar http://127.0.0.1:4173/; then
            anotar "La web no respondió" web.log; cat web.log; exit 1
          fi

          # `set +e` alrededor de Playwright: con `-e`, un fallo cortaría el paso aquí mismo y
          # ni se recogería el rastro ni se pararían los procesos. Era el agujero del intento
          # anterior, donde `codigo=$?` nunca llegaba a ejecutarse.
          set +e
          (cd web && npx playwright test 2>&1) | tee playwright.log
          codigo=${PIPESTATUS[0]}
          set -e

          kill $api $web 2>/dev/null || true

          if [ "$codigo" -ne 0 ]; then
            anotar "Playwright" playwright.log

            # Las peticiones y su código, sin el resto del registro de EF Core: en un fallo de
            # interfaz lo primero que hay que descartar es que el backend respondiera mal.
            grep -oE 'Request finished HTTP/1.1 [A-Z]+ [^ ]+ - [0-9]+' api.log \
              | sed -E 's#.*1 ([A-Z]+) http://[^/]+(\S*) - ([0-9]+)#\3 \1 \2#' > peticiones.log || true
            anotar "Peticiones a la Api" peticiones.log

            # `error-context.md` es la instantánea de accesibilidad de la página en el momento
            # del fallo: dice qué había en pantalla de verdad, que es justo lo que no se puede
            # deducir del «element not found».
            for contexto in web/test-results/*/error-context.md; do
              [ -f "$contexto" ] && anotar "Pantalla en el fallo" "$contexto"
            done
          fi

          exit "$codigo"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rastros-e2e
          path: |
            web/test-results
            api.log
            web.log
            playwright.log

  compose:
    name: Despliegue con Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secretos de la instalación
        run: |
          set -euo pipefail
          # Generados en el momento: el compose falla si faltan (`:?`), y eso es parte de lo
          # que se comprueba aquí. Una clave fija en el repositorio sería la clave de firma
          # de todas las instalaciones que no la cambiaran.
          {
            echo "POSTGRES_CLAVE=$(openssl rand -base64 32)"
            echo "GESTORINVE_CLAVE_BD=$(openssl rand -base64 32 | tr -d '/+=')"
            echo "JWT_CLAVE=$(openssl rand -base64 48)"
            echo "PUERTO_WEB=8080"
          } > .env
      - name: El compose exige los secretos
        run: |
          set -euo pipefail
          # Comprobación invertida: sin `.env` el compose **debe** fallar. Si arrancara con
          # valores por omisión, la instalación de una pyme quedaría con secretos públicos.
          if docker compose --env-file /dev/null config > /dev/null 2>&1; then
            echo "::error::El compose arrancó sin secretos declarados."
            exit 1
          fi
      - name: Construir y levantar
        run: |
          set -euo pipefail
          docker compose up --build --detach --wait --wait-timeout 420
      - name: El rol de la base no tiene privilegios
        run: |
          set -euo pipefail
          # La garantía de aislamiento de H2 depende de esto: un superusuario (o BYPASSRLS)
          # ignora las políticas RLS y una empresa vería los datos de otra.
          privilegiado=$(docker compose exec -T db psql -tAc \
            "select rolsuper or rolbypassrls from pg_roles where rolname = 'gestorinve'" \
            --username postgres --dbname postgres | tr -d '[:space:]')
          test "$privilegiado" = "f"
      - name: El esquema quedó aplicado
        run: |
          set -euo pipefail
          # `GESTORINVE_MIGRAR=true` en el compose: si no migrara, la Api arrancaría «sana»
          # contra una base vacía y el primer alta fallaría ya instalado.
          tablas=$(docker compose exec -T db psql -tAc \
            "select count(*) from information_schema.tables
             where table_schema in ('auditoria','catalogo','inventario','seguridad')" \
            --username postgres --dbname gestorinve | tr -d '[:space:]')
          echo "Tablas de la aplicación: $tablas"
          test "$tablas" -ge 16
      - name: La web y la Api responden en el mismo origen
        run: |
          set -euo pipefail
          # La web sirve el SPA y reenvía los prefijos de la Api; la Api **no** publica puerto.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = "200"
          # Una ruta del enrutador del cliente tiene que devolver el index, no un 404 de nginx.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/inventario)" = "200"
          # 401 y no 404: la petición llegó a la Api a través del proxy y la rechazó por falta
          # de credenciales, que es la respuesta correcta.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/auth/yo)" = "401"
          # El alta de empresa es el único flujo que escribe sin sesión previa: si responde,
          # la cadena nginx → Api → PostgreSQL con RLS funciona de punta a punta.
          codigo=$(curl -s -o alta.json -w '%{http_code}' \
            -X POST http://127.0.0.1:8080/empresas \
            -H 'content-type: application/json' \
            -d '{"nit":"DOCKER9000001","razonSocial":"Prueba Compose",
                 "correoAdmin":"admin@prueba.test","nombreAdmin":"Administrador",
                 "contrasena":"Contrasena-De-Prueba-1"}')
          echo "alta: $codigo $(cat alta.json)"
          test "$codigo" = "201"
      - name: El contenedor de la Api se declara sano
        run: |
          set -euo pipefail
          # `--wait` ya espera los healthchecks, pero se comprueba el estado explícitamente:
          # un HEALTHCHECK mal escrito deja el contenedor en «starting» sin que nada falle.
          estado=$(docker inspect --format '{{.State.Health.Status}}' \
            "$(docker compose ps -q api)")
          echo "api: $estado"
          test "$estado" = "healthy"
      - name: Diagnóstico
        if: always()
        run: docker compose logs --no-color --tail 200
      - name: Bajar
        if: always()
        run: docker compose down --volumes
