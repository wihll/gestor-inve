# La web y la Api se sirven desde el **mismo origen**: nginx reenvía los prefijos de la Api
# al contenedor `api` y todo lo demás lo resuelve como SPA. Así no hace falta CORS, y el
# token de refresco puede viajar en una cookie de mismo sitio en lugar de quedar expuesto
# a cualquier script de otro origen.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sin esto, el navegador puede adivinar el tipo de un recurso y ejecutar como script algo
    # que se subió como imagen.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Los nombres de Vite llevan hash de contenido, así que son inmutables; `index.html` no,
    # y cachearlo dejaría al usuario con una versión vieja apuntando a bundles que ya no existen.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~ ^/(auth|empresas|catalogo|inventario|usuarios)(/|$) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: una ruta que el servidor no conoce la decide el enrutador del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
